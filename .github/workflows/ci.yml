name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: React ${{ matrix.react }}
    runs-on: ubuntu-latest

    # peerDependencies allow react >=18, so both majors run.
    strategy:
      fail-fast: false
      matrix:
        react: ['18', '19']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Downgrade to React 18
        if: matrix.react == '18'
        run: pnpm add -D react@18 react-dom@18 @types/react@18 @types/react-dom@18

      - run: pnpm format:check

      - run: pnpm typecheck

      # Before the tests: packaging.test.ts skips silently without dist/.
      - run: pnpm build

      - run: pnpm test
